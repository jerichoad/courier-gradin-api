info:
  name: List Couriers - Sort Created At
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/api/couriers?sort=-created_at"
  headers:
    - name: accept
      value: application/json
  body:
    type: none
  auth:
    type: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("orders by created_at DESC", function() {
          expect(res.status).to.equal(200);
          const dates = res.body.data.data.map(c => new Date(c.created_at).getTime());
          const sortedDesc = [...dates].sort((a, b) => b - a);
          expect(dates).to.deep.equal(sortedDesc);
        });

settings:
  encodeUrl: true
