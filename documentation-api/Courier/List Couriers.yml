info:
  name: List Couriers
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/couriers?page=1"
  headers:
    - name: accept
      value: application/json
  body:
    type: none
  auth:
    type: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns paginated list sorted by courier_name ASC by default", function() {
          expect(res.status).to.equal(200);
          expect(res.body.success).to.equal(true);
          expect(res.body.data).to.have.property("data");
          expect(res.body.data).to.have.property("per_page", 15);
        });

settings:
  encodeUrl: true
