info:
  name: Update Courier
  type: http
  seq: 10

http:
  method: PUT
  url: "{{baseUrl}}/api/couriers/{{courierId}}"
  headers:
    - name: accept
      value: application/json
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "courier_code": "{{courierCode}}",
        "courier_name": "Sinta Dewi",
        "courier_phone": "081298765432",
        "courier_email": "sinta@example.test",
        "courier_level": 4,
        "courier_address": "Jl. Sudirman 20",
        "is_active": true
      }
  auth:
    type: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("updates the courier", function() {
          expect(res.status).to.equal(200);
          expect(res.body.success).to.equal(true);
          expect(res.body.data.courier_name).to.equal("Sinta Dewi");
          expect(res.body.data.courier_level).to.equal(4);
        });

settings:
  encodeUrl: true
