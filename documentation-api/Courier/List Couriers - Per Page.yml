info:
  name: List Couriers - Per Page
  type: http
  seq: 15

http:
  method: GET
  url: "{{baseUrl}}/api/couriers?per_page=5"
  headers:
    - name: accept
      value: application/json
  body:
    type: none
  auth:
    type: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("honours a custom per_page", function() {
          expect(res.status).to.equal(200);
          expect(res.body.data.per_page).to.equal(5);
          expect(res.body.data.data.length).to.be.at.most(5);
        });

settings:
  encodeUrl: true
