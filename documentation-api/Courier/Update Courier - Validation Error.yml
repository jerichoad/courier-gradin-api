info:
  name: Update Courier - Validation Error
  type: http
  seq: 11

http:
  method: PUT
  url: "{{baseUrl}}/api/couriers/{{courierId}}"
  headers:
    - name: accept
      value: application/json
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "courier_code": "{{courierCode}}",
        "courier_name": "ab",
        "courier_level": 0
      }
  auth:
    type: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 422 with field errors", function() {
          expect(res.status).to.equal(422);
          expect(res.body.success).to.equal(false);
          expect(res.body.errors).to.have.property("courier_name");
          expect(res.body.errors).to.have.property("courier_level");
        });

settings:
  encodeUrl: true
