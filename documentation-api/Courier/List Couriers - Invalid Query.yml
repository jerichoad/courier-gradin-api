info:
  name: List Couriers - Invalid Query
  type: http
  seq: 16

http:
  method: GET
  url: "{{baseUrl}}/api/couriers?per_page=500&level=9"
  headers:
    - name: accept
      value: application/json
  body:
    type: none
  auth:
    type: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("rejects out of range per_page and level", function() {
          expect(res.status).to.equal(422);
          expect(res.body.success).to.equal(false);
          expect(res.body.message).to.equal("Validation failed.");
          expect(res.body.errors).to.have.property("per_page");
          expect(res.body.errors).to.have.property("level");
        });

settings:
  encodeUrl: true
