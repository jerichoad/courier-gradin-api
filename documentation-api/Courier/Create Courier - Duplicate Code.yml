info:
  name: Create Courier - Duplicate Code
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/couriers"
  headers:
    - name: accept
      value: application/json
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "courier_code": "{{courierCode}}",
        "courier_name": "Duplicate Courier",
        "courier_level": 1
      }
  auth:
    type: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns 422 for duplicate courier_code", function() {
          expect(res.status).to.equal(422);
          expect(res.body.success).to.equal(false);
          expect(res.body.errors).to.have.property("courier_code");
        });

settings:
  encodeUrl: true
